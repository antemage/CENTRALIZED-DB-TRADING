# At :01 past every hour: 1h candles, then 15m candles, then funding (single script run)
name: Ingest hourly (1h + 15m + funding)

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Ingest 1h then 15m then funding
        run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_MODE: 'hourly'
          # Tighter delays on CI (runner↔HL/Supabase latency already adds time)
          BATCH_DELAY_MS: '250'
          BATCH_COOLDOWN_MS: '30000'
          BATCH_COOLDOWN_EVERY: '8'
          BATCH_SIZE: '12'
