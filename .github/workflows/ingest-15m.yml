# 7 times per hour (UTC): :08, :16, :23, :31, :38, :46, :53. Hourly at :01 also runs 15m (with 1h + funding).
# 15m candles only (no funding; funding runs hourly at :01)
name: Ingest 15m candles

on:
  schedule:
    - cron: '8,16,23,31,38,46,53 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Ingest 15m candles only
        run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INTERVAL: '15m'
          SKIP_FUNDING: '1'
          BATCH_DELAY_MS: '250'
          BATCH_SIZE: '12'
